<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анализ партии</title>
<link rel="stylesheet" href="/static/vendor/chessground.base.css">
<link rel="stylesheet" href="/static/vendor/chessground.brown.css">
<link rel="stylesheet" href="/static/vendor/chessground.cburnett.css">
<style>
  * { box-sizing: border-box; }
  :root { --bs: max(280px, min(92vw, calc(100vh - 210px), 640px)); --panel: #262522; --line: #3c3a37; --muted: #9b9893; }
  body { margin: 0; background: #312e2b; color: #e8e6e3; font: 15px system-ui, sans-serif; }
  textarea, input, button { background: #3c3a37; color: inherit; border: 1px solid #4b4847; border-radius: 6px; padding: 8px 10px; font: inherit; }
  textarea:focus, input:focus { outline: 2px solid #81b64c; outline-offset: -1px; }
  button { background: #81b64c; border: 0; font-weight: 700; cursor: pointer; color: #fff; }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: default; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); }
  .brand { font-weight: 800; font-size: 20px; margin-right: 8px; color: inherit; text-decoration: none; }
  .brand span { color: #81b64c; }
  .load { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
  .load textarea { flex: 1 1 320px; height: 40px; min-height: 40px; resize: vertical; }
  #progress { height: 3px; background: transparent; }
  #progress div { height: 100%; width: 0; background: #81b64c; transition: width .2s; }
  #status { text-align: center; color: #c9c6c1; min-height: 1.4em; padding: 6px; }
  #status.err { color: #fa7a6a; }
  #acctbtn { background: #3c3a37; white-space: nowrap; }
  dialog { background: var(--panel); color: inherit; border: 1px solid #4b4847; border-radius: 10px; padding: 18px; width: min(92vw, 340px); }
  dialog::backdrop { background: #0009; }
  dialog h3 { margin: 0 0 12px; }
  dialog .sites { display: flex; gap: 16px; margin-bottom: 10px; }
  dialog input[name=user] { width: 100%; }
  dialog menu { display: flex; gap: 8px; padding: 0; margin: 14px 0 0; } dialog menu button { flex: 1; }
  button.ghost { background: #3c3a37; }
  .mygames { width: 250px; padding: 10px; }
  .mygames .top { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-weight: 700; }
  .mygames .top small { color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mygames .top button { margin-left: auto; background: none; padding: 2px 6px; font-size: 16px; }
  .mygames ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .mygames li { display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 6px; background: #2f2d2a; cursor: pointer; }
  .mygames li:hover { background: #3c3a37; } .mygames li.on { outline: 2px solid #81b64c; }
  .mygames li div { min-width: 0; } .mygames li b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .mygames li small { color: var(--muted); }
  .pager { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .pager button { flex: 1; background: #3c3a37; padding: 6px; font-size: 13px; }
  .pager span { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .res { flex: none; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font-weight: 800; color: #fff; }
  .res.w { background: #81b64c; } .res.l { background: #fa412d; } .res.d { background: #777; }
  @media (max-width: 1360px) { .mygames { width: min(100%, 1084px); } .mygames ul { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); } }
  main { display: flex; gap: 16px; padding: 8px 16px 16px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .pbar { display: flex; align-items: center; gap: 8px; height: 32px; padding-left: 28px; font-weight: 600; }
  .pbar .elo { color: var(--muted); font-weight: 400; }
  .pbar i { width: 20px; height: 20px; border-radius: 4px; box-shadow: inset 0 0 0 1px #0004; }
  .boardbox { display: flex; gap: 6px; }
  #evalbar { position: relative; width: 22px; background: #403d39; border-radius: 3px; overflow: hidden; display: flex; flex-direction: column-reverse; }
  #evalbar.flip { flex-direction: column; }
  #evalw { background: #f0f0f0; height: 50%; transition: height .4s; }
  #evtxt { position: absolute; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 800; }
  #evtxt.bot { bottom: 4px; color: #333; } #evtxt.top { top: 4px; color: #eee; }
  #wrap { position: relative; width: var(--bs); height: var(--bs); flex: none; container-type: inline-size; }
  #board { width: 100%; height: 100%; }
  #wrap coords { font-size: max(10px, 1.9cqi); font-weight: 700; opacity: 1; }
  #wrap coords coord { flex: 1 1 0; }
  #wrap coords.ranks { top: 0; left: 3px; } #wrap coords.ranks coord { transform: none; padding-top: 2px; }
  #wrap coords.files { left: 0; bottom: 0; height: auto; } #wrap coords.files coord { text-align: right; padding: 0 3px 1px 0; }
  #wrap cg-board square.last-move { background-color: var(--hl, rgba(155, 199, 0, .41)); }
  #wrap cg-board square.marked { background-color: rgba(235, 97, 80, .8); } /* ПКМ по клетке */
  #wrap svg.cg-shapes circle { display: none; } /* вместо кружков chessground красим клетку целиком */
  .badge { position: absolute; z-index: 5; width: 5.4cqi; height: 5.4cqi; border-radius: 50%; display: grid; place-items: center;
           translate: -60% -40%; color: #fff; font-weight: 800; font-size: 2.5cqi; box-shadow: 0 1px 3px #0009;
           pointer-events: none; animation: pop .35s ease-out; }
  .badge.brilliant, .badge.great { animation: pop .35s ease-out, glow 1s ease-out .3s 2; }
  .flash { position: absolute; z-index: 4; width: 12.5%; height: 12.5%; pointer-events: none; animation: flash 1.2s ease-out forwards; }
  @keyframes pop { 0% { scale: 0; } 70% { scale: 1.4; } 100% { scale: 1; } }
  @keyframes glow { from { box-shadow: 0 0 0 0 var(--c); } to { box-shadow: 0 0 0 3cqi transparent; } }
  @keyframes flash { 0% { opacity: .9; scale: .6; } 40% { opacity: .7; scale: 1.15; } 100% { opacity: 0; scale: 1; } }
  .side { width: min(calc(92vw + 28px), 400px); max-height: calc(var(--bs) + 64px); display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--panel); border-radius: 8px; padding: 12px; }
  .card:empty, #moves:empty { display: none; }
  .hint { color: var(--muted); line-height: 1.5; }
  .ic { display: inline-grid; place-items: center; width: 1.45em; height: 1.45em; border-radius: 50%; color: #fff; flex: none;
        font-style: normal; font-weight: 800; font-size: .75em; margin-right: 4px; vertical-align: middle; }
  .ic svg, .badge svg { width: 68%; height: 68%; fill: currentColor; }
  .players { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; text-align: center; gap: 8px; }
  .players .lbl { color: var(--muted); padding-bottom: 8px; }
  .players .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acc { font-size: 24px; font-weight: 800; margin-top: 4px; padding: 2px 8px; border-radius: 6px; }
  .acc.w { background: #f0f0f0; color: #222; }
  .acc.b { background: #111; }
  .opening { color: var(--muted); text-align: center; margin: 10px 0 6px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 2px 4px; } td:first-child, td:last-child { text-align: center; width: 3em; font-weight: 700; }
  td.jump { cursor: pointer; border-radius: 4px; } td.jump:hover { background: #3c3a37; text-decoration: underline; }
  #comment { flex: none; }
  #comment .head { display: flex; align-items: center; gap: 4px; font-size: 16px; }
  #comment .ev { margin-left: auto; font-weight: 700; color: #ccc; background: #3c3a37; padding: 2px 8px; border-radius: 4px; font-size: 14px; }
  #comment .best { margin-top: 6px; color: var(--muted); }
  #comment .var { margin-top: 10px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; line-height: 1.8; }
  #comment .var button { padding: 4px 10px; font-size: 13px; }
  #comment .var .no { color: #8b8987; margin-left: 4px; }
  .vmv { padding: 2px 4px; border-radius: 4px; cursor: pointer; } .vmv:hover { background: #3c3a37; } .vmv.cur { background: #4b4847; font-weight: 700; }
  #moves { position: relative; flex: 1; min-height: 120px; overflow: auto; display: grid; grid-template-columns: 2.6em 1fr 1fr; align-content: start; padding: 6px; }
  #moves .no { color: #8b8987; padding: 4px 0 4px 6px; }
  .mv { padding: 4px 6px; cursor: pointer; border-radius: 4px; white-space: nowrap; }
  .mv:hover { background: #3c3a37; } .mv.cur { background: #4b4847; font-weight: 700; }
  .nav { display: flex; gap: 6px; flex: none; } .nav button { flex: 1; background: #3c3a37; font-size: 18px; padding: 10px; }
  button { touch-action: manipulation; } /* без задержки и зума по двойному тапу */
  @media (max-width: 900px) {
    .side { max-height: none; } #moves { max-height: 300px; } #comment { order: -1; }
  }
  /* режимы: в задачах/штурме прячем всё, что относится к анализу */
  .modes { display: flex; gap: 4px; }
  .modes button { background: #3c3a37; padding: 7px 12px; }
  .modes button.on { background: #81b64c; }
  body:not([data-mode=analysis]) :is(#summary, #comment, #moves, .nav) { display: none !important; }
  /* visibility, не display: пустое место остаётся, и доска не прыгает при переключении режимов */
  body:not([data-mode=analysis]) :is(.load, #mygames, #evalbar, .pbar) { visibility: hidden; }
  @media (max-width: 1360px) { body:not([data-mode=analysis]) #mygames { display: none; } }
  body[data-auth=out] > :not(#auth, script) { display: none !important; }
  #auth { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  body[data-auth=in] #auth { display: none; }
  #auth form { width: min(92vw, 340px); display: flex; flex-direction: column; gap: 10px; padding: 22px; }
  #auth .brand { text-align: center; font-size: 26px; margin: 0 0 6px; }
  #auth .tabs { display: flex; gap: 6px; } #auth .tabs button { flex: 1; background: #3c3a37; }
  #auth .tabs button.on { background: #81b64c; }
  #autherr { color: #fa7a6a; min-height: 1.2em; font-size: 13px; }
  dialog .wide { width: 100%; margin-top: 8px; }
  body[data-mode=analysis] #pz { display: none; }
  #pz { display: flex; flex-direction: column; gap: 10px; }
  #pz h3 { margin: 0; font-size: 18px; }
  #pz .big { font-size: 34px; font-weight: 800; }
  #pz .delta.up { color: #81b64c; } #pz .delta.down { color: #fa412d; }
  #pz .msg { padding: 10px; border-radius: 6px; background: #2f2d2a; font-weight: 600; }
  #pz .msg.ok { background: #2f4a1f; color: #b5e48c; } #pz .msg.bad { background: #4a1f1f; color: #ffaaa0; }
  #pz .row { display: flex; gap: 6px; } #pz .row button { flex: 1; }
  #pz .tags { color: var(--muted); font-size: 13px; }
  #pz .stat { display: flex; justify-content: space-between; align-items: center; }
  #pz .timer { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #pz .timer.low { color: #fa412d; }
  #pz .strikes { font-size: 22px; letter-spacing: 4px; color: #4b4847; } #pz .strikes b { color: #fa412d; }
  #pz .trail { display: flex; flex-wrap: wrap; gap: 4px; }
  #pz .trail i { width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 800; color: #fff; }
  #pz .trail i.ok { background: #81b64c; } #pz .trail i.bad { background: #fa412d; }
  #wrap cg-board square.hint { background: rgba(80, 160, 255, .55); }
  @media (max-width: 700px) {
    /* телефон: доска во всю ширину, партии — лентой, навигация — снизу под большим пальцем */
    :root { --bs: calc(100vw - 36px); }
    body { font-size: 14px; }
    header { padding: 8px; gap: 8px; }
    .brand { flex: 1; font-size: 17px; }
    #acctbtn { padding: 6px 10px; max-width: 50vw; overflow: hidden; text-overflow: ellipsis; }
    .load { order: 3; flex-basis: 100%; flex-wrap: nowrap; }
    .modes { order: 2; flex-basis: 100%; } .modes button { flex: 1; }
    body:not([data-mode=analysis]) .load { display: none; }
    .load textarea { flex: 1; height: 38px; min-height: 38px; font-size: 13px; }
    #status { padding: 4px; font-size: 13px; }
    main { padding: 4px 8px 72px; gap: 8px; }
    .mygames { width: 100%; padding: 8px; }
    .mygames .top { margin-bottom: 6px; }
    .mygames ul { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .mygames li { flex: 0 0 auto; width: 165px; padding: 6px; scroll-snap-align: start; }
    .boardbox { gap: 4px; }
    #evalbar { width: 14px; }
    #evtxt { font-size: 8px; }
    .pbar { height: 26px; padding-left: 18px; font-size: 13px; }
    .pbar i { width: 16px; height: 16px; }
    .side { width: 100%; }
    .card { padding: 10px; }
    .acc { font-size: 20px; }
    td { padding: 1px 4px; }
    .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
           background: var(--panel); box-shadow: 0 -2px 8px #0006; }
    .nav button { padding: 12px 0; }
  }
</style>
</head>
<body data-mode="analysis" data-auth="out">
<div id="auth">
  <form class="card">
    <div class="brand">Chess<span>Analyze</span></div>
    <div class="tabs"><button type="button" data-t="login" class="on">Вход</button><button type="button" data-t="register">Регистрация</button></div>
    <input name="username" placeholder="Логин" autocomplete="username" required>
    <input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <div id="autherr"></div>
    <button type="submit" id="authgo">Войти</button>
  </form>
</div>
<header>
  <a class="brand" href="/" title="На главную">Chess<span>Analyze</span></a>
  <nav class="modes"><button data-mode="analysis" class="on">Анализ</button><button data-mode="puzzle">Задачи</button><button data-mode="rush">Штурм</button></nav>
  <div class="load">
    <textarea id="input" placeholder="PGN или ссылка на партию lichess"></textarea>
    <button id="go">Анализировать</button>
  </div>
  <button id="acctbtn">Аккаунт</button>
</header>
<div id="progress"><div></div></div>
<div id="status"></div>
<dialog id="acct">
  <form method="dialog">
    <h3>Аккаунт <span id="whoami" class="hint"></span></h3>
    <div class="hint" style="margin-bottom:8px">Ник chess.com или lichess для списка «Мои партии»</div>
    <div class="sites">
      <label><input type="radio" name="site" value="chesscom" checked> chess.com</label>
      <label><input type="radio" name="site" value="lichess"> lichess</label>
    </div>
    <input name="user" placeholder="Ник (пусто — отвязать)" pattern="[A-Za-z0-9_\-]{2,30}" autocomplete="off">
    <menu>
      <button value="save">Сохранить</button>
      <button value="cancel" class="ghost" formnovalidate>Отмена</button>
    </menu>
    <button value="logout" class="ghost wide" formnovalidate>Выйти из аккаунта</button>
  </form>
</dialog>
<main>
  <aside class="card mygames" id="mygames"></aside>
  <section>
    <div class="pbar" id="ptop"></div>
    <div class="boardbox">
      <div id="evalbar"><div id="evalw"></div><span id="evtxt"></span></div>
      <div id="wrap"><div id="board"></div></div>
    </div>
    <div class="pbar" id="pbot"></div>
  </section>
  <aside class="side">
    <div class="card" id="pz"></div>
    <div class="card hint" id="summary">Выберите партию слева (кнопка «Аккаунт» — ваш ник chess.com или lichess) или вставьте PGN / ссылку lichess сверху.<br>Stockfish 17 проанализирует её прямо в браузере.</div>
    <div class="card" id="comment"></div>
    <div class="card" id="moves"></div>
    <div class="nav">
      <button data-d="-999" title="В начало (Home)">⏮</button><button data-d="-1" title="Назад (←)">◀</button><button data-d="1" title="Вперёд (→)">▶</button><button data-d="999" title="В конец (End)">⏭</button><button id="flip" title="Перевернуть (F)">⇅</button><button id="mute" title="Звук (M)">🔊</button>
    </div>
  </aside>
</main>
<script type="module">
import { Chessground } from '/static/vendor/chessground.min.js';
import { Chess } from '/static/vendor/chess.js';

const svg = d => `<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const CLS = {
  brilliant: ['Блестящий', '!!', '#26c2a3'],
  great: ['Замечательный', '!', '#749bbf'],
  book: ['Теоретический', svg('M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z'), '#a88865'],
  best: ['Лучший', '★', '#81b64c'],
  excellent: ['Отличный', svg('M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z'), '#81b64c'],
  good: ['Неплохой', '✓', '#95b776'],
  inaccuracy: ['Неточность', '?!', '#f7c631'],
  mistake: ['Ошибка', '?', '#ffa459'],
  miss: ['Упущенный шанс', '✗', '#ff7769'],
  blunder: ['Зевок', '??', '#fa412d'],
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const icon = cls => `<i class="ic ${cls}" style="background:${CLS[cls][2]}">${CLS[cls][1]}</i>`;
const status = (text, err) => { $('status').textContent = text; $('status').className = err ? 'err' : ''; };
const progress = frac => $('progress').firstElementChild.style.width = frac * 100 + '%';

async function api(url, body) {
  const r = await fetch(url, body && { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !url.startsWith('/api/auth')) showAuth(); // сессия кончилась — снова экран входа
  if (!r.ok) throw new Error(j.error || `Ошибка сервера (${r.status})`);
  return j;
}

// --- Stockfish (WASM, работает у пользователя, сервер не грузит)
// Полный многопоточный движок (79 МБ, кэшируется) на компьютерах; облегчённый — на телефонах и слабых машинах.
const cores = navigator.hardwareConcurrency || 1;
const MOBILE = navigator.userAgentData?.mobile || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)
  || matchMedia('(pointer: coarse)').matches;
const FULL = self.crossOriginIsolated && cores >= 4 && !MOBILE;
const ENGINE = FULL
  // 2 потока: ПК остаётся свободным. Больше потоков/времени — сильнее анализ, но выше нагрузка.
  ? { file: 'stockfish-17.1-8e4d048.js', go: 'go depth 22 movetime 500', threads: 2, hash: 64, name: 'Stockfish 17.1' }
  : { file: 'stockfish-17.1-lite-single-03e3232.js', go: 'go depth 14 movetime 400', threads: 1, hash: 32, name: 'Stockfish 17.1 lite' };
// go: сила анализа. Меняешь — проверь точность против chess.com (константы ACC_* в analysis.py)
const sf = new Worker('/static/engine/' + ENGINE.file);
let onLine = () => {};
sf.onmessage = e => onLine(e.data);
const send = s => sf.postMessage(s);
const ready = new Promise(res => onLine = l => l === 'readyok' && res());
['uci', `setoption name Threads value ${ENGINE.threads}`, `setoption name Hash value ${ENGINE.hash}`,
  'setoption name MultiPV value 2', 'isready'].forEach(send);

function evalFen(fen) {
  const lines = [];
  const done = new Promise(res => onLine = l => {
    const m = l.match(/ multipv (\d) .*?score (cp|mate) (-?\d+).*? pv (\S+)/);
    if (m) lines[m[1] - 1] = { [m[2]]: +m[3], move: m[4] };
    else if (l.startsWith('bestmove')) res(lines);
  });
  send('position fen ' + fen);
  send(ENGINE.go);
  return done;
}

const evalCache = new Map(); // fen -> оценка; ходы на доске из позиций партии не пересчитываются
let engineChain = Promise.resolve(); // движок один — запросы строго по очереди

async function evalWhite(fen) {
  if (evalCache.has(fen)) return evalCache.get(fen);
  await ready; // ход до загрузки движка не должен перехватить его 'readyok'
  const [a, b] = await evalFen(fen);
  const s = fen.split(' ')[1] === 'w' ? 1 : -1; // движок даёт оценку за ходящего, храним за белых
  const pov = x => x && ('cp' in x ? { cp: x.cp * s } : { mate: x.mate * s });
  const ev = a ? { best: a.move, ...pov(a), second: pov(b) || null } : null;
  evalCache.set(fen, ev);
  return ev;
}
const queued = job => (engineChain = engineChain.then(job, job));

async function analyse(fens) {
  await ready;
  send('ucinewgame');
  evalCache.clear();
  const evals = [];
  for (const [i, fen] of fens.entries()) {
    status(`${ENGINE.name} (${ENGINE.threads} пот.): позиция ${i + 1} из ${fens.length}`);
    progress(i / fens.length);
    evals.push(await evalWhite(fen));
  }
  return evals;
}

// --- Доска
// Пустая «партия» из начальной позиции: на главной можно сразу ходить, движок оценивает ходы
const blankGame = () => ({ moves: [], start_fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
  scores: [{ cp: 0, wp: 0.5 }], headers: {}, opening: '', stats: {} });
let R = blankGame(), ply = 0, flipped = false, analysing = false;
let VAR = null; // свой вариант: { base: ply партии, nodes: [{fen, uci, san, cls, best_*, score}], idx: сколько ходов показано }
// Рисование как на chess.com: ПКМ+тянуть — стрелка, ПКМ по клетке — красная клетка, ЛКМ — стереть всё.
const markSquares = shapes => cg.set({ highlight: { custom: new Map(shapes.filter(sh => !sh.dest).map(sh => [sh.orig, 'marked'])) } });
const cg = Chessground($('board'), {
  animation: { duration: 250 },
  movable: { free: false, color: undefined, showDests: true, events: { after: (o, d) => MODE === 'analysis' ? userMove(o, d) : puzzleMove(o, d) } },
  disableContextMenu: true,
  drawable: {
    enabled: true, eraseOnClick: true, onChange: markSquares,
    brushes: {
      green: { key: 'g', color: '#ffaa00', opacity: 0.85, lineWidth: 15 }, // стрелка пользователя (оранжевая)
      best: { key: 'b', color: '#15781b', opacity: 0.8, lineWidth: 15 },  // лучший ход движка
    },
  },
});
new ResizeObserver(() => cg.redrawAll()).observe($('wrap'));
const evalText = (sc, m) => m?.san.endsWith('#') ? (sc.wp > .5 ? '1-0' : '0-1')
  : 'mate' in sc ? 'M' + Math.abs(sc.mate) : (Math.abs(sc.cp) / 100).toFixed(1);

// --- Звуки
const SND = Object.fromEntries(['move-self', 'move-opponent', 'move-check', 'capture', 'castle',
  'promote', 'game-end', 'game-start', 'brilliant-move', 'puzzle-correct', 'puzzle-wrong']
  .map(n => [n, new Audio(`/static/sounds/${n}.mp3`)]));
let muted = localStorage.muted === '1';
const play = name => {
  if (muted) return;
  const a = SND[name];
  a.currentTime = 0;
  a.play().catch(() => {}); // браузер блокирует звук до первого клика — не страшно
};
function moveSound({ san, fen }) {
  const who = (fen.split(' ')[1] === 'b') !== flipped ? 'self' : 'opponent'; // «свой» ход — за сторону снизу доски
  return san.includes('#') ? 'game-end' : san.includes('+') ? 'move-check' : san.includes('=') ? 'promote'
    : san.startsWith('O-O') ? 'castle' : san.includes('x') ? 'capture' : `move-${who}`;
}
function setMuted(v) {
  muted = v;
  localStorage.muted = v ? '1' : '0';
  $('mute').textContent = v ? '🔇' : '🔊';
}

// Легальные ходы для доски (chess.js); ходить можно после анализа партии
function movable(fen) {
  if (!R || analysing) return { color: undefined, dests: new Map() };
  const dests = new Map();
  for (const m of new Chess(fen).moves({ verbose: true })) dests.set(m.from, [...(dests.get(m.from) || []), m.to]);
  return { color: fen.split(' ')[1] === 'w' ? 'white' : 'black', dests };
}

// Рисует позицию: доска, значок хода, стрелка лучшего, шкала. m — показанный ход (или null), sc — оценка (или null: считается)
function paint(fen, m, sc) {
  cg.set({
    fen, lastMove: m && [m.uci.slice(0, 2), m.uci.slice(2, 4)],
    turnColor: fen.split(' ')[1] === 'w' ? 'white' : 'black', check: !!m && /[+#]$/.test(m.san),
    highlight: { custom: new Map() }, movable: movable(fen),
  });
  cg.setShapes([]); // нарисованное относится к позиции — при смене хода стираем, как chess.com
  cg.setAutoShapes(m?.best_uci ? [{ orig: m.best_uci.slice(0, 2), dest: m.best_uci.slice(2, 4), brush: 'best' }] : []);

  const wrap = $('wrap');
  wrap.querySelectorAll('.badge, .flash').forEach(e => e.remove());
  wrap.style.removeProperty('--hl');
  if (sc) {
    $('evalw').style.height = sc.wp * 100 + '%';
    $('evtxt').textContent = evalText(sc, m);
    $('evtxt').className = (sc.wp >= .5) !== flipped ? 'bot' : 'top';
  }
  if (!m?.cls) return;
  const [, sym, color] = CLS[m.cls];
  const f = m.uci.charCodeAt(2) - 97, r = +m.uci[3] - 1;
  const x = flipped ? 7 - f : f, y = flipped ? r : 7 - r;
  wrap.style.setProperty('--hl', color + '99');
  const badge = Object.assign(document.createElement('div'), { className: 'badge ' + m.cls, innerHTML: sym });
  badge.style.cssText = `left:${(x + 1) * 12.5}%;top:${y * 12.5}%;background:${color};--c:${color}`;
  wrap.append(badge);
  if (m.cls === 'brilliant' || m.cls === 'great') {
    const fl = document.createElement('div');
    fl.className = 'flash';
    fl.style.cssText = `left:${x * 12.5}%;top:${y * 12.5}%;background:radial-gradient(${color}, transparent 70%)`;
    wrap.append(fl);
  }
}

// Заголовок комментария: значок, ход, категория, оценка, лучший ход
function moveInfo(m, sc, no) {
  if (!m.cls) return `<div class="head"><b>${no}${m.san}</b>&nbsp;—&nbsp;<span class="hint">считаю…</span></div>`;
  const [name, , color] = CLS[m.cls];
  const sign = m.san.endsWith('#') ? '' : sc.wp >= .5 ? '+' : '−';
  return `<div class="head">${icon(m.cls)}<b>${no}${m.san}</b>&nbsp;—&nbsp;<span style="color:${color}">${name}</span>` +
    `<span class="ev">${sign}${evalText(sc, m)}</span></div>` +
    (m.best_san ? `<div class="best">Лучший ход: <b>${m.best_san}</b></div>` : '') +
    (m.cls === 'book' && (m.opening || R.opening) ? `<div class="best">${esc(m.opening || R.opening)}</div>` : '');
}
const moveNo = p => Math.ceil(p / 2) + (p % 2 ? '. ' : '… ');
const sfx = m => { play(moveSound(m)); if (m.cls === 'brilliant') setTimeout(() => play('brilliant-move'), 150); };

function go(n) {
  if (!R) return;
  VAR = null;
  const prev = ply;
  ply = Math.max(0, Math.min(R.moves.length, n));
  const m = R.moves[ply - 1];
  if (m && ply !== prev) sfx(m);
  paint(m ? m.fen : R.start_fen, m, R.scores[ply]);
  document.querySelectorAll('.mv.cur').forEach(e => e.classList.remove('cur'));
  if (!m) {
    $('comment').innerHTML = `<span class="hint">${R.moves.length ? 'Начальная позиция — листайте ← → или сделайте свой ход на доске'
      : 'Сделайте ход на доске — движок сразу его оценит. Или загрузите партию.'}</span>`;
    return;
  }
  $('comment').innerHTML = moveInfo(m, R.scores[ply], moveNo(ply));
  const cur = document.querySelector(`.mv[data-i="${ply}"]`);
  cur.classList.add('cur');
  $('moves').scrollTop = cur.offsetTop - $('moves').clientHeight / 2; // не scrollIntoView: тот прокручивает всю страницу
}

// --- Свой вариант: ход мышкой из любой позиции, движок сразу оценивает его
function showVar() {
  const k = VAR.idx, m = VAR.nodes[k - 1];
  const fen = m ? m.fen : (VAR.base ? R.moves[VAR.base - 1].fen : R.start_fen);
  paint(fen, m, m ? m.score : R.scores[VAR.base]);
  const line = VAR.nodes.map((n, i) => {
    const p = VAR.base + i + 1;
    return (p % 2 || i === 0 ? `<span class="no">${moveNo(p).trim()}</span>` : '') +
      `<span class="vmv${i === k - 1 ? ' cur' : ''}" data-v="${i + 1}">${n.cls ? icon(n.cls) : ''}${n.san}</span>`;
  }).join(' ');
  $('comment').innerHTML = (m ? moveInfo(m, m.score, moveNo(VAR.base + k)) : '<span class="hint">Начало варианта</span>') +
    `<div class="var"><button id="tomain" class="ghost">${R.moves.length ? '↩ К партии' : '↺ Сначала'}</button><span>Вариант: ${line}</span></div>`;
}

async function userMove(orig, dest) {
  const fenBefore = VAR ? (VAR.idx ? VAR.nodes[VAR.idx - 1].fen : (VAR.base ? R.moves[VAR.base - 1].fen : R.start_fen))
    : (ply ? R.moves[ply - 1].fen : R.start_fen);
  const game = new Chess(fenBefore);
  const mv = game.move({ from: orig, to: dest, promotion: 'q' }); // ponytail: превращение всегда в ферзя
  if (!VAR) VAR = { base: ply, nodes: [], idx: 0 };
  const prevNode = VAR.idx ? VAR.nodes[VAR.idx - 1] : R.moves[VAR.base - 1];
  VAR.nodes = VAR.nodes.slice(0, VAR.idx); // новый ход отрезает старое продолжение варианта
  const node = { fen: game.fen(), uci: mv.lan, san: mv.san, score: null };
  VAR.nodes.push(node);
  VAR.idx++;
  sfx(node);
  showVar();
  try {
    const [before, after] = await queued(async () => [await evalWhite(fenBefore), await evalWhite(node.fen)]);
    Object.assign(node, await api('/api/judge', { fen: fenBefore, uci: node.uci, before, after, prev_cls: prevNode?.cls, prev_uci: prevNode?.uci }));
  } catch (e) {
    status(e.message, true);
    return;
  }
  if (VAR?.nodes[VAR.idx - 1] === node) showVar(); // пользователь мог уже уйти на другой ход
  if (node.cls === 'brilliant') play('brilliant-move');
}

// ← → внутри варианта; ← из начала варианта и любые прыжки — обратно в партию
function step(d) {
  if (VAR && d === 1 && VAR.idx < VAR.nodes.length) { VAR.idx++; sfx(VAR.nodes[VAR.idx - 1]); return showVar(); }
  if (VAR && d === -1 && VAR.idx > 0) { VAR.idx--; return showVar(); }
  if (VAR && d === 1) return;
  go(ply + d);
}
const refresh = () => VAR ? showVar() : go(ply);

function flip(v = !flipped) {
  flipped = v;
  cg.set({ orientation: v ? 'black' : 'white' });
  $('evalbar').classList.toggle('flip', v);
  const h = R?.headers || {};
  const bar = (c, name, elo) => `<i style="background:${c === 'w' ? '#f0f0f0' : '#111'}"></i>${esc(name && name !== '?' ? name : c === 'w' ? 'Белые' : 'Чёрные')} <span class="elo">${elo ? `(${esc(elo)})` : ''}</span>`;
  const [top, bot] = [bar('b', h.Black, h.BlackElo), bar('w', h.White, h.WhiteElo)];
  $('ptop').innerHTML = v ? bot : top;
  $('pbot').innerHTML = v ? top : bot;
  refresh();
}

function render() {
  const h = R.headers, st = R.stats;
  const count = (c, k) => {
    const n = st[c]?.counts[k] || 0;
    return n ? `<td class="jump" data-c="${c}" data-k="${k}" title="К первому такому ходу">${n}</td>` : '<td>0</td>';
  };
  const player = (c, name) => `<div><div class="name">${esc(name && name !== '?' ? name : c === 'w' ? 'Белые' : 'Чёрные')}</div><div class="acc ${c}">${st[c]?.accuracy ?? '—'}</div></div>`;
  $('summary').className = 'card';
  $('summary').innerHTML = `<div class="players">${player('w', h.White)}<div class="lbl">Точность</div>${player('b', h.Black)}</div>
    <div class="opening">${esc(R.opening)}</div>
    <table>${Object.keys(CLS).map(k => `<tr>${count('w', k)}<td>${icon(k)}${CLS[k][0]}</td>${count('b', k)}</tr>`).join('')}</table>`;
  $('moves').innerHTML = R.moves.map((m, i) => (i % 2 ? '' : `<span class="no">${i / 2 + 1}.</span>`) +
    `<span class="mv" data-i="${i + 1}">${icon(m.cls)}${m.san}</span>`).join('');
}

async function run(input, asBlack = false) {
  document.querySelectorAll('.load button').forEach(b => b.disabled = true);
  try {
    status('Загрузка партии…');
    const g = await api('/api/game', { input });
    analysing = true;
    VAR = null;
    cg.set({ movable: { color: undefined, dests: new Map() } }); // пока идёт анализ — ходить нельзя
    const evals = await queued(() => analyse(g.fens));
    analysing = false;
    R = await api('/api/report', { pgn: g.pgn, evals });
    render();
    ply = 0;
    status('');
    progress(0);
    flip(asBlack);
    go(0);
    play('game-start');
  } catch (e) {
    status(e.message, true);
    progress(0);
  } finally {
    analysing = false;
    document.querySelectorAll('.load button').forEach(b => b.disabled = false);
  }
}

$('go').onclick = () => run($('input').value);
// --- Аккаунт: ник хранится в браузере, слева последние 5 партий
let account = null; // привязанный ник { site, user } — хранится в аккаунте на сервере
const SITE = { chesscom: 'chess.com', lichess: 'lichess' };

let gamesPage = 0;

async function loadMyGames(page = gamesPage) {
  gamesPage = page;
  const box = $('mygames');
  if (!account) {
    box.innerHTML = '<div class="hint">Нажмите «Аккаунт» и укажите ник chess.com или lichess — здесь будут ваши последние партии.</div>';
    return;
  }
  const top = `<div class="top">Мои партии <small>${esc(SITE[account.site])}</small><button id="reload" title="Обновить">↻</button></div>`;
  box.innerHTML = top + '<div class="hint">Загрузка…</div>';
  let list, more;
  try {
    ({ games: list, more } = await api(`/api/games/${account.site}/${encodeURIComponent(account.user)}?page=${page}`));
  } catch (e) {
    box.innerHTML = top + `<div class="hint">${esc(e.message)}</div>`;
    return;
  }
  const me = account.user.toLowerCase();
  const games = list.map(g => {
    const black = g.black.toLowerCase() === me;
    const res = !g.winner ? 'd' : (g.winner === 'black') === black ? 'w' : 'l';
    const [opp, elo] = black ? [g.white, g.white_elo] : [g.black, g.black_elo];
    return { ...g, black, res, opp, elo };
  });
  box.innerHTML = top + (games.length ? `<ul>${games.map((g, i) => `<li data-i="${i}">
      <span class="res ${g.res}">${{ w: 'В', l: 'П', d: 'Н' }[g.res]}</span>
      <div><b>${g.black ? '♚' : '♔'} ${esc(g.opp)} ${g.elo ? `(${g.elo})` : ''}</b>
      <small>${esc(g.speed || '')} · ${new Date(g.end * 1000).toLocaleDateString('ru')}</small></div></li>`).join('')}</ul>`
    : '<div class="hint">Партий не найдено</div>') +
    `<div class="pager"><button data-p="-1" ${page ? '' : 'disabled'}>‹ Новее</button><span>стр. ${page + 1}</span>` +
    `<button data-p="1" ${more ? '' : 'disabled'}>Старее ›</button></div>`;
  box.onclick = e => {
    if (e.target.id === 'reload') return loadMyGames(0);
    const p = e.target.closest('.pager button');
    if (p) return loadMyGames(gamesPage + +p.dataset.p);
    const li = e.target.closest('li');
    if (!li || $('go').disabled) return;
    box.querySelectorAll('li.on').forEach(x => x.classList.remove('on'));
    li.classList.add('on');
    const g = games[li.dataset.i];
    run(g.pgn, g.black);
  };
}

// --- Вход: без аккаунта сайт не работает; рейтинг задач, рекорд штурма и ник хранятся на сервере

// ===================== Задачи и штурм (база задач lichess, CC0) =====================
let MODE = 'analysis';
let PZ = null; // текущая задача: { data, game, sol: [uci], step, color, failed, done }
const PR = { rating: 1200, games: 0 }; // рейтинг задач (с сервера)
const THEMES = {
  mate: 'Мат', mateIn1: 'Мат в 1', mateIn2: 'Мат в 2', mateIn3: 'Мат в 3', mateIn4: 'Мат в 4', fork: 'Вилка', pin: 'Связка',
  skewer: 'Сквозной удар', hangingPiece: 'Висящая фигура', sacrifice: 'Жертва', discoveredAttack: 'Вскрытое нападение',
  doubleCheck: 'Двойной шах', deflection: 'Отвлечение', attraction: 'Завлечение', backRankMate: 'Мат по последней горизонтали',
  promotion: 'Превращение', trappedPiece: 'Пойманная фигура', clearance: 'Освобождение поля', interference: 'Перекрытие',
  intermezzo: 'Промежуточный ход', quietMove: 'Тихий ход', zugzwang: 'Цугцванг', advantage: 'Выигрыш материала',
  crushing: 'Решающее преимущество', endgame: 'Эндшпиль', middlegame: 'Миттельшпиль', opening: 'Дебют',
  smotheredMate: 'Спёртый мат', exposedKing: 'Открытый король', kingsideAttack: 'Атака на короля', defensiveMove: 'Защита',
};

async function fetchPuzzle(rating, short) { // без rating — под рейтинг игрока; уже сыгранные сервер не выдаёт
  return api(rating === undefined ? '/api/puzzle' : `/api/puzzle?rating=${Math.round(rating)}${short ? '&short=1' : ''}`);
}

function pzMovable() {
  if (!PZ || PZ.done || PZ.step >= PZ.sol.length || PZ.step % 2 === 0) return { color: undefined, dests: new Map() };
  const dests = new Map();
  for (const m of PZ.game.moves({ verbose: true })) dests.set(m.from, [...(dests.get(m.from) || []), m.to]);
  return { color: PZ.color, dests };
}
function pzShow(lastMove) {
  cg.set({ fen: PZ.game.fen(), lastMove, turnColor: PZ.game.turn() === 'w' ? 'white' : 'black', check: PZ.game.inCheck(),
    movable: pzMovable(), highlight: { custom: new Map() } });
}
function pzPlay(uci) { // ход соперника (или показ решения)
  const mv = PZ.game.move({ from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci[4] });
  PZ.step++;
  PZ.last = [mv.from, mv.to];
  play(mv.san.includes('+') ? 'move-check' : mv.captured ? 'capture' : 'move-opponent');
  pzShow(PZ.last);
}

function startPuzzle(data) {
  const game = new Chess(data.fen);
  PZ = { data, game, sol: data.moves.split(' '), step: 0, color: game.turn() === 'w' ? 'black' : 'white', failed: false, done: false };
  cg.setShapes([]);
  cg.setAutoShapes([]);
  $('wrap').querySelectorAll('.badge, .flash').forEach(e => e.remove());
  $('wrap').style.removeProperty('--hl');
  cg.set({ orientation: PZ.color });
  pzShow(undefined);
  const mine = PZ;
  setTimeout(() => { if (PZ === mine) { pzPlay(PZ.sol[0]); pzRender(); } }, 500); // первый ход — соперника
  pzRender();
}

function puzzleMove(orig, dest) {
  const want = PZ.sol[PZ.step];
  const mv = PZ.game.move({ from: orig, to: dest, promotion: want?.startsWith(orig + dest) ? want[4] || 'q' : 'q' });
  if (mv.lan !== want && !PZ.game.isCheckmate()) { // любой матующий ход тоже засчитывается (как на lichess)
    PZ.game.undo();
    pzShow(PZ.last); // откатываем неверный ход
    play('puzzle-wrong');
    return MODE === 'rush' ? rushResult(false) : pzFail();
  }
  PZ.step++;
  play(mv.san.includes('+') ? 'move-check' : mv.captured ? 'capture' : 'move-self');
  if (PZ.step >= PZ.sol.length || PZ.game.isCheckmate()) {
    PZ.done = true;
    pzShow([mv.from, mv.to]);
    play('puzzle-correct');
    return MODE === 'rush' ? rushResult(true) : pzSolved();
  }
  pzShow([mv.from, mv.to]);
  const mine = PZ;
  setTimeout(() => { if (PZ === mine) pzPlay(PZ.sol[PZ.step]); }, 300);
}

// --- рейтинговые задачи: Эло против рейтинга задачи считает сервер, засчитывается только первая попытка
async function rate(p, win) {
  try {
    const r = await api('/api/puzzle/result', { id: p.data.id, win });
    Object.assign(PR, { rating: r.rating, games: r.games });
    p.delta = r.delta;
  } catch (e) { status(e.message, true); }
  if (PZ === p) pzRender();
}
async function pzSolved() { PZ.result = 'ok'; pzRender(); if (!PZ.failed) await rate(PZ, true); }
async function pzFail() {
  PZ.result = 'bad';
  pzRender();
  if (!PZ.failed) { PZ.failed = true; await rate(PZ, false); }
}
async function nextPuzzle() { $('pz').innerHTML = '<span class="hint">Загрузка задачи…</span>'; startPuzzle(await fetchPuzzle()); }

function pzRender() {
  if (MODE === 'rush') return rushRender();
  const d = PZ.delta, sign = d > 0 ? '+' : '';
  const tags = PZ.data.themes.split(' ').map(t => THEMES[t]).filter(Boolean).join(' · ');
  const side = PZ.color === 'white' ? 'белых' : 'чёрных';
  const msg = PZ.result === 'ok' ? `<div class="msg ok">✓ Решено!</div>`
    : PZ.result === 'bad' ? `<div class="msg bad">✗ Неверно. Попробуйте ещё или посмотрите решение.</div>`
    : `<div class="msg">Ход ${side}: найдите лучший ход</div>`;
  $('pz').innerHTML = `<h3>Задачи</h3>
    <div class="stat"><span>Ваш рейтинг</span><span><span class="big">${PR.rating}</span>
      ${d !== undefined ? `<span class="delta ${d >= 0 ? 'up' : 'down'}">${sign}${d}</span>` : ''}</span></div>
    ${msg}
    ${PZ.result ? `<div class="tags">Рейтинг задачи: ${PZ.data.rating}${tags ? ' · ' + tags : ''}</div>` : ''}
    <div class="row">${PZ.done ? '' : '<button id="pzhint" class="ghost">Подсказка</button><button id="pzsol" class="ghost">Решение</button>'}
      <button id="pznext">${PZ.done ? 'Следующая →' : 'Пропустить'}</button></div>
    <div class="tags">Сыграно задач: ${PR.games}. Подсказка, решение или пропуск засчитываются как неудача.</div>`;
}

$('pz').onclick = async e => {
  const id = e.target.id;
  if (id === 'pznext') {
    if (MODE === 'puzzle' && PZ && !PZ.done && !PZ.failed && PZ.step > 0) await pzFail(); // пропуск = неудача (до новой задачи)
    return MODE === 'rush' ? null : nextPuzzle();
  }
  if (id === 'pzhint' && PZ.step % 2 === 1) {
    pzFail();
    cg.set({ highlight: { custom: new Map([[PZ.sol[PZ.step].slice(0, 2), 'hint']]) } });
  }
  if (id === 'pzsol') {
    pzFail();
    PZ.done = true;
    const mine = PZ;
    (function next() {
      if (PZ !== mine || PZ.step >= PZ.sol.length) return pzRender();
      pzPlay(PZ.sol[PZ.step]);
      setTimeout(next, 600);
    })();
  }
  if (id === 'rushgo') rushStart();
};

// --- штурм: 3 минуты, 3 ошибки — конец; задачи короткие и с каждой становятся сложнее (как Puzzle Rush на chess.com)
const RUSH_TIME = 180_000;
let RUSH = null;
const rushRating = n => 400 + n * 50; // 1-я задача ~400, 20-я ~1400, 40-я ~2400

async function rushStart() {
  RUSH = { score: 0, strikes: 0, n: 0, trail: [], end: Date.now() + RUSH_TIME, over: false };
  RUSH.next = fetchPuzzle(rushRating(0), true);
  RUSH.timer = setInterval(() => { if (Date.now() >= RUSH.end) rushOver(); else rushRender(); }, 200);
  await rushNext();
}
async function rushNext() {
  const data = await RUSH.next;
  RUSH.n++;
  RUSH.next = fetchPuzzle(rushRating(RUSH.n), true); // следующую грузим заранее
  if (!RUSH.over) startPuzzle(data);
}
function rushResult(ok) {
  if (RUSH.over) return;
  PZ.done = true;
  RUSH.trail.push(ok);
  if (ok) RUSH.score++; else RUSH.strikes++;
  if (RUSH.strikes >= 3) return rushOver();
  rushRender();
  setTimeout(rushNext, ok ? 250 : 600);
}
function rushOver() {
  if (!RUSH || RUSH.over) return;
  RUSH.over = true;
  clearInterval(RUSH.timer);
  if (PZ) { PZ.done = true; pzShow(undefined); }
  play('game-end');
  RUSH.best = Math.max(ME.rush_best, RUSH.score);
  RUSH.record = RUSH.score > ME.rush_best;
  ME.rush_best = RUSH.best;
  rushRender();
  api('/api/rush/result', { score: RUSH.score }).catch(e => status(e.message, true));
}
function rushRender() {
  if (!RUSH) {
    $('pz').innerHTML = `<h3>Штурм</h3>
      <div>3 минуты — решите как можно больше задач. Задачи становятся сложнее с каждой решённой.
      Три ошибки — и штурм окончен.</div>
      <div class="stat"><span>Рекорд</span><span class="big">${ME.rush_best}</span></div>
      <div class="row"><button id="rushgo">Начать</button></div>`;
    return;
  }
  const left = Math.max(0, RUSH.end - Date.now()), sec = Math.ceil(left / 1000);
  const trail = `<div class="trail">${RUSH.trail.map(ok => `<i class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}</i>`).join('')}</div>`;
  if (RUSH.over) {
    $('pz').innerHTML = `<h3>Штурм окончен</h3>
      <div class="stat"><span>Решено</span><span class="big">${RUSH.score}</span></div>
      <div class="msg ${RUSH.record ? 'ok' : ''}">${RUSH.record ? '🏆 Новый рекорд!' : `Рекорд: ${RUSH.best}`}</div>
      ${trail}<div class="row"><button id="rushgo">Ещё раз</button></div>`;
    return;
  }
  $('pz').innerHTML = `<div class="stat"><span class="timer ${sec <= 20 ? 'low' : ''}">${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}</span>
      <span class="big">${RUSH.score}</span></div>
    <div class="stat"><span>Ход ${PZ?.color === 'black' ? 'чёрных' : 'белых'}</span>
      <span class="strikes">${[0, 1, 2].map(i => i < RUSH.strikes ? '<b>✗</b>' : '✗').join('')}</span></div>
    ${trail}`;
}

function setMode(m) {
  if (RUSH && !RUSH.over && m !== 'rush') { clearInterval(RUSH.timer); RUSH = null; }
  MODE = m;
  document.body.dataset.mode = m;
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  if (m === 'analysis') { PZ = null; cg.set({ orientation: flipped ? 'black' : 'white' }); return refresh(); }
  if (m === 'puzzle') return nextPuzzle();
  RUSH = null;
  PZ = null;
  cg.set({ orientation: 'white', fen: 'start', lastMove: undefined, check: false, movable: { color: undefined, dests: new Map() } });
  cg.setAutoShapes([]);
  $('wrap').querySelectorAll('.badge, .flash').forEach(e => e.remove());
  rushRender();
}
document.querySelector('.modes').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.mode !== MODE) setMode(b.dataset.mode); };
$('summary').onclick = e => {
  const t = e.target.closest('td.jump');
  if (!t) return;
  // ход сделала сторона, которая НЕ ходит в позиции после него
  const i = R.moves.findIndex(m => m.cls === t.dataset.k && m.fen.split(' ')[1] !== t.dataset.c);
  if (i >= 0) go(i + 1);
};
$('moves').onclick = e => { const t = e.target.closest('.mv'); if (t) go(+t.dataset.i); };
flip(false);
api('/api/me').then(me => { applyMe(me); start(); }, () => showAuth());
document.querySelectorAll('.nav [data-d]').forEach(b => b.onclick = () => step(+b.dataset.d));
$('comment').onclick = e => {
  if (e.target.id === 'tomain') return go(VAR.base);
  const v = e.target.closest('.vmv');
  if (v) { VAR.idx = +v.dataset.v; showVar(); }
};
$('flip').onclick = () => flip();
$('mute').onclick = () => setMuted(!muted);
setMuted(muted);
document.addEventListener('keydown', e => {
  if (e.target.matches('textarea, input')) return;
  if (MODE !== 'analysis') { if (e.key === 'Enter' || e.key === 'ArrowRight') $('pznext')?.click(); return; }
  const d = { ArrowLeft: -1, ArrowRight: 1, Home: -999, End: 999 }[e.key];
  if (d) { e.preventDefault(); step(d); }
  if (e.key === 'f') flip();
  if (e.key === 'm') setMuted(!muted);
});
</script>
</body>
